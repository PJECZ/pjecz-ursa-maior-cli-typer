[project]
name = "pjecz-ursa-maior-cli-typer"
version = "1.1.0"
description = "CLI hecho con Typer para administrar las digitalizaciones."
readme = "README.md"
authors = [
    { name = "Guillermo Valdes", email = "guillermo.valdes@pjecz.gob.mx" }
]
requires-python = ">=3.14"
dependencies = [
    "google-auth>=2.62.0",
    "google-cloud>=0.34.0",
    "google-cloud-secret-manager>=2.31.0",
    "google-cloud-storage>=3.17.1",
    "hashids>=1.3.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pytz>=2026.5",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.6",
    "sqlalchemy-utils>=0.43.0",
    "typer>=0.27.3",
    "unidecode>=1.4.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "ruff>=0.17.2",
]

[project.scripts]
pjecz-ursa-maior-cli-typer = "pjecz_ursa_maior_cli_typer.main:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.black]
line-length = 128

[tool.isort]
line_length = 128
profile = "black"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportCallIssue = "hint"
reportMissingImports = "warning"
reportUndefinedVariable = "warning"
exclude = ["**/tests"]

[tool.ruff]
ignore = ["F821", "RUF012"]
line-length = 128
