[project]
name = "pjecz-ursa-maior-cli-typer"
version = "0.1.0"
description = "CLI hecho con Typer para administrar las digitalizaciones."
readme = "README.md"
authors = [
    { name = "Guillermo Valdes", email = "guillermo.valdes@pjecz.gob.mx" }
]
requires-python = ">=3.14"
dependencies = [
    "google-auth>=2.58.0",
    "google-cloud>=0.34.0",
    "google-cloud-secret-manager>=2.30.0",
    "google-cloud-storage>=3.14.1",
    "hashids>=1.3.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytz>=2026.3.post1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
    "sqlalchemy-utils>=0.42.1",
    "typer>=0.27.2",
    "unidecode>=1.4.0",
]

[tool.black]
line-length = 128

[tool.isort]
line_length = 128
profile = "black"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportCallIssue = "hint"
reportMissingImports = "warning"
reportUndefinedVariable = "warning"
exclude = ["**/tests"]

[tool.ruff]
ignore = ["F821"]
line-length = 128
